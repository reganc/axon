name: axon

# Slot ports/subnet into comet conventions before deploying.
# The DB image (timescaledb-ha) bundles pgvector + timescaledb; artifacts/schema.sql
# is applied on first init (it creates the vector + uuid-ossp extensions).

services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${AXON_DB_PORT:-4102}:5432"   # dev convenience; internal-only in prod
    volumes:
      - dbdata:/home/postgres/pgdata/data
      - ./artifacts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [axon_net]

  cache:
    image: redis:7-alpine
    ports:
      - "${AXON_REDIS_PORT:-4103}:6379"   # dev convenience; internal-only in prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [axon_net]

  api:
    build: ./backend
    env_file: .env
    ports:
      - "${AXON_API_PORT:-4100}:8100"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach Ollama on the comet host
    depends_on:
      db: { condition: service_healthy }
      cache: { condition: service_healthy }
    volumes:
      - voice_models:/models/voice   # Piper + Whisper model cache (AXON_VOICE_MODEL_DIR)
    networks: [axon_net]

networks:
  axon_net:
    ipam:
      config:
        - subnet: 172.34.0.0/24   # free block: 172.31/.32/.33/.50 taken; default pool is 172.17-29

volumes:
  dbdata:
  voice_models:
